id = "jievince.herdr-codex-app"
name = "Herdr Codex App"
version = "0.1.6"
min_herdr_version = "0.7.5"
description = "Turn Herdr into a terminal-first Codex app: sync projects, resume chats."
platforms = ["linux"]

[[build]]
command = ["node", "scripts/preflight.mjs"]

[[startup]]
command = ["node", "src/sync.mjs"]

[[actions]]
id = "sync"
title = "Sync recent Codex chats"
contexts = ["global", "workspace"]
command = ["node", "src/sync.mjs"]

[[events]]
on = "pane.focused"
command = ["node", "src/focus.mjs"]
